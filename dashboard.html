<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard | AgenticCore Pakistan</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#071F17">
<link rel="icon" href="https://agenticcore.estate/images/agenticcore-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/p2.css">
</head>
<body data-page="dashboard" data-wa-fallback="#support">
<div id="site-header"></div>
<div class="container dash">
  <nav class="dash-nav" id="dashNav" aria-label="Dashboard sections">
    <a href="#home" data-route="home" data-i18n="d_home">Home</a>
    <a href="#pack" data-route="pack" data-i18n="ws_market">Market a property</a>
    <a href="#order" data-route="order" data-i18n="d_order">New order</a>
    <a href="#tasks" data-route="tasks"><span data-i18n="d_tasks">My tasks</span><span class="count hidden" id="navWaiting"></span></a>
    <a href="#deliveries" data-route="deliveries" data-i18n="d_deliveries">Deliveries</a>
    <a href="#invoices" data-route="invoices" data-i18n="d_invoices">Invoices</a>
    <a href="#usage" data-route="usage" data-i18n="d_usage">Package usage</a>
    <a href="#points" data-route="points" data-i18n="d_points">Points &amp; referrals</a>
    <a href="#listings" data-route="listings" data-i18n="d_listings">Estate listings</a>
    <a href="#profile" data-route="profile" data-i18n="d_profile">Profile &amp; brand kit</a>
    <a href="#support" data-route="support" data-i18n="d_support">Support</a>
  </nav>
  <main class="dash-main" id="view" aria-live="polite"><p class="loading">Loading…</p></main>
</div>

<dialog id="dlg"></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/db-client.js"></script>
<script src="js/i18n.js"></script>
<script src="js/i18n-p2.js"></script>
<script src="js/i18n-v2.js"></script>
<script src="js/catalog-core.js"></script>
<script src="js/partials.js"></script>
<script src="js/catalog-render.js"></script>
<script src="js/task-ui.js"></script>
<script src="js/briefs.js"></script>
<script src="js/discovery.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/dashboard-p2.js"></script>
</body>
</html>
